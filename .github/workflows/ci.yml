name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies (high severity blocks)
        run: npm audit --omit=dev --audit-level=high

      # A current upstream ReDoS advisory affects picomatch through 4.0.7,
      # and no fixed npm release is available yet. The affected copies are
      # development-only transitive dependencies in this repository.
      - name: Audit all dependencies (critical severity blocks)
        run: npm audit --audit-level=critical

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
